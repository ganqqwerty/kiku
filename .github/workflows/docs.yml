name: Публикация русской документации

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v5

      - name: Установить pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Установить Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Установить зависимости
        run: pnpm install --frozen-lockfile

      - name: Собрать документацию
        run: pnpm build

      - name: Настроить GitHub Pages
        uses: actions/configure-pages@v5

      - name: Загрузить сайт
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Опубликовать сайт
        id: deployment
        uses: actions/deploy-pages@v4
